
name: Actualizar EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar XMLTV
        run: python generate_epg.py

      - name: Publicar cambios
        run: |
          git add epg.xml
          if git diff --cached --quiet -- epg.xml; then
            echo "El EPG no tuvo cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar EPG"
          git push

